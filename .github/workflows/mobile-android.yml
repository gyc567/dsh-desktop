name: Mobile Android shell

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-android.yml'
  workflow_dispatch:

concurrency: mobile-android-${{ github.ref }}

jobs:
  android-apk:
    name: Build Android APK
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile
    outputs:
      keystore_missing: ${{ steps.mobile_secrets.outputs.missing }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Validate mobile signing secret
        id: mobile_secrets
        shell: bash
        env:
          KEYSTORE: ${{ secrets.MOBILE_ANDROID_KEYSTORE }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::Missing MOBILE_ANDROID_KEYSTORE; the APK will be signed with the debug key."
            echo "missing=1" >> "$GITHUB_OUTPUT"
          else
            echo "missing=0" >> "$GITHUB_OUTPUT"
          fi
      - name: Set shell version from release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/set-version.mjs "${GITHUB_REF_NAME#v}"
      - run: npm ci
      - name: Write release keystore
        if: steps.mobile_secrets.outputs.missing != '1'
        shell: bash
        env:
          KEYSTORE: ${{ secrets.MOBILE_ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.MOBILE_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MOBILE_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MOBILE_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE" | base64 -d > android/keystore.jks
          {
            echo "storeFile=keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
      - name: Sync Capacitor
        run: npx cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Ensure fallback debug keystore
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Build release APK
        run: cd android && ./gradlew assembleRelease
      - name: Stage artifact
        run: cp android/app/build/outputs/apk/release/app-release.apk aura-mobile-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-android
          path: mobile/aura-mobile-android.apk
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 7 || 1 }}
